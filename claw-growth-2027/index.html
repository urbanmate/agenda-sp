<script>
(async()=>{
  const base="https://raw.githubusercontent.com/urbanmate/agenda-sp/claw-growth-2027-static/claw-growth-2027/";
  try{
    const [a,b]=await Promise.all([fetch(base+"site-html-gz-b64-1.txt"),fetch(base+"site-html-gz-b64-2.txt")]);
    if(!a.ok||!b.ok) throw new Error("payload");
    const b64=(await a.text()).trim()+(await b.text()).trim();
    const bin=atob(b64), bytes=new Uint8Array(bin.length);
    for(let i=0;i<bin.length;i++) bytes[i]=bin.charCodeAt(i);
    const stream=new Blob([bytes]).stream().pipeThrough(new DecompressionStream("gzip"));
    let html=await new Response(stream).text();
    html=html.replace(/<meta property="og:image" content="[^"]*" \/>/,'<meta property="og:image" content="https://claw-growth-2027.lovable.app/og-claw-growth-2027.png" />');
    document.open(); document.write(html); document.close();
  }catch(e){
    document.body.innerHTML='<div style="max-width:520px;padding:32px;line-height:1.6"><strong>Não foi possível carregar a proposta.</strong><br>Tente atualizar a página.</div>';
  }
})();
</script>
