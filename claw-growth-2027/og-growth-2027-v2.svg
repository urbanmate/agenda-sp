<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#06111f"/>
      <stop offset="0.58" stop-color="#071426"/>
      <stop offset="1" stop-color="#0a1a31"/>
    </linearGradient>
    <linearGradient id="blue" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2f65d5" stop-opacity=".72"/>
      <stop offset="1" stop-color="#4d83ff" stop-opacity=".95"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>

  <!-- blue arcs -->
  <g fill="none" stroke="url(#blue)" stroke-width="2.1" opacity=".88">
    <circle cx="1215" cy="-35" r="250"/>
    <circle cx="1215" cy="-35" r="335"/>
    <circle cx="1215" cy="-35" r="420"/>
  </g>

  <!-- top label -->
  <text x="72" y="86" fill="#e2c27f" font-family="Arial, DejaVu Sans, sans-serif" font-size="24" font-weight="500" letter-spacing="5">C LAW EXPERIENCE</text>
  <rect x="72" y="116" width="360" height="5" rx="2.5" fill="#d9b764"/>

  <!-- author badge -->
  <circle cx="1080" cy="88" r="47" fill="none" stroke="#f5f6f8" stroke-width="1.5"/>
  <text x="1080" y="101" text-anchor="middle" fill="#ffffff" font-family="Arial, DejaVu Sans, sans-serif" font-size="40" font-weight="700">W</text>
  <circle cx="1111" cy="118" r="6.5" fill="#d9b764"/>

  <!-- title -->
  <text x="72" y="264" fill="#f7f8fb" font-family="Arial, DejaVu Sans, sans-serif" font-size="84" font-weight="700" letter-spacing="-2.2">Proposta de</text>
  <text x="72" y="354" fill="#f7f8fb" font-family="Arial, DejaVu Sans, sans-serif" font-size="84" font-weight="700" letter-spacing="-2.2">Growth 2027</text>

  <!-- subtitle -->
  <text x="72" y="440" fill="#a9c6f5" font-family="Arial, DejaVu Sans, sans-serif" font-size="42" font-weight="400" letter-spacing="-0.7">Growth Foundation + Growth Leadership</text>

  <!-- footer -->
  <text x="72" y="546" fill="#ffffff" font-family="Arial, DejaVu Sans, sans-serif" font-size="27" font-weight="600">Wagner Soares</text>
  <line x1="282" y1="537" x2="338" y2="537" stroke="#8097b7" stroke-width="1.5"/>
  <text x="360" y="546" fill="#849bbc" font-family="Arial, DejaVu Sans, sans-serif" font-size="22" font-weight="400">Proposta estratégica • Setembro 2026</text>
