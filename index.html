'all';const fav=new Set(JSON.parse(localStorage.getItem('agendaSpFavs')||'[]'));const priceGroups=[['free','GRÁTIS'],['under50','ATÉ R$ 50'],['over50','ACIMA DE R$ 50']];const view=document.getElementById('view'),favs=document.getElementById('favs');function card(e,favView=false){const liked=fav.has(e.id),sold=e.status.toLowerCase().includes('esgot');return `<article class="card"><div class="main"><div class="top"><h3>${e.name}</h3><span class="priority">${e.priority}</span></div><div class="meta"><span class="pill">${e.time}</span><span class="pill">${e.bairro}</span><span class="pill ${sold?'sold':e.priceType==='free'?'free':'paid'}">${e.price}</span><span class="pill">${e.cat}</span><span class="pill">${e.env}</span><span class="pill ${e.rain==='ok'?'rainok':e.rain==='depends'?'dep':'dry'}">${e.rainLabel}</span></div><div class="acts"><button class="btn primary detailsBtn">Ver detalhes</button><button class="btn favBtn" data-id="${e.id}">${liked?'♥ Tenho interesse':'♡ Tenho interesse'}</button><button class="btn copyBtn" data-id="${e.id}">Copiar resumo</button>${favView?`<button class="btn removeBtn" data-id="${e.id}">Remover</button>`:''}</div></div><div class="details"><p><b>Sobre:</b> ${e.desc}</p><p><b>Local:</b> ${e.venue}<br>${e.address}</p><p><b>Preço/status:</b> ${e.price} · ${e.status}</p><p><b>Reserva:</b> ${e.reserve}</p><p><b>Por que vale:</b> ${e.why}</p><p><b>Chuva/logística:</b> ${e.rainLabel} · ${e.climate}</p>${e.alert?`<div class="alert">${e.alert}</div>`:''}<div class="links"><a href="${e.official}" target="_blank">Informações oficiais</a>${e.ticket?`<a href="${e.ticket}" target="_blank">Ingressos</a>`:''}<a href="${e.maps}" target="_blank">Google Maps</a></div></div></article>`}function current(){return E.filter(e=>e.day===day).filter(e=>filter==='free'?e.priceType==='free':filter==='carnival'?e.carnival:filter==='rain'?e.rain==='ok':filter==='out'?['Outdoor','Misto'].includes(e.env):true)}function bind(root){root.querySelectorAll('.detailsBtn').forEach(b=>b.onclick=()=>{const c=b.closest('.card');c.classList.toggle('open');b.textContent=c.classList.contains('open')?'Ocultar detalhes':'Ver detalhes'});root.querySelectorAll('.favBtn').forEach(b=>b.onclick=()=>{fav.has(b.dataset.id)?fav.delete(b.dataset.id):fav.add(b.dataset.id);localStorage.setItem('agendaSpFavs',JSON.stringify([...fav]));render();renderFavs()});root.querySelectorAll('.removeBtn').forEach(b=>b.onclick=()=>{fav.delete(b.dataset.id);localStorage.setItem('agendaSpFavs',JSON.stringify([...fav]));render();renderFavs()});root.querySelectorAll('.copyBtn').forEach(b=>b.onclick=async()=>{const e=E.find(x=>x.id===b.dataset.id);await navigator.clipboard.writeText(`${e.name}\n${e.date} · ${e.time}\n${e.venue} · ${e.bairro}\n${e.price}\n${e.ticket||e.official}`);b.textContent='Copiado ✓';setTimeout(()=>b.textContent='Copiar resumo',1200)})}function render(){const d=D[day],list=current();let h=`<div class="day"><h2>${d.title}</h2><p class="sub">${d.summary}</p><span class="forecast">${d.forecast}</span></div><div class="filters"><button class="filter ${filter==='all'?'active':''}" data-f="all">Todos</button><button class="filter ${filter==='free'?'active':''}" data-f="free">Só grátis</button><button class="filter ${filter==='carnival'?'active':''}" data-f="carnival">Carnaval/Samba</button><button class="filter ${filter==='rain'?'active':''}" data-f="rain">🟢 Chuva OK</button><button class="filter ${filter==='out'?'active':''}" data-f="out">☀️ Ao ar livre</button></div>`;priceGroups.forEach(([k,l])=>{const a=list.filter(e=>e.priceType===k).sort((a,b)=>a.start.localeCompare(b.start));if(a.length)h+=`<section class="group"><div class="group-title">${l}</div><div class="cards">${a.map(e=>card(e)).join('')}</div></section>`});if(!list.length)h+='<div class="empty">Nenhum evento neste filtro.</div>';view.innerHTML=h;view.querySelectorAll('.filter').forEach(b=>b.onclick=()=>{filter=b.dataset.f;render()});bind(view)}function renderFavs(){const a=E.filter(e=>fav.has(e.id));favs.innerHTML=a.length?a.map(e=>card(e,true)).join(''):'<div class="empty">Nenhum favorito ainda.</div>';bind(favs)}document.querySelectorAll('.tab').forEach(b=>b.onclick=()=>{document.querySelectorAll('.tab').forEach(x=>x.classList.remove('active'));b.classList.add('active');day=b.dataset.day;filter='all';render()});render();renderFavs();</script></body></html>
